// BobbyBones lab: public duel-vs-bot server (the lab plugin keeps it on Blood Run, permanent warmup)
set sv_hostname "^1B^3o^2b^5b^4y^6B^1o^3n^2e^5s ^7Lab | 1v1 vs bot | warmup"
set sv_tags "bot,duel,practice,bobbybones"
set sv_maxclients 8
set sv_serverType 2
set sv_master 1
set sv_mapPoolFile "mappool_lab.txt"
set g_allowVote 1
set g_doWarmup 1
set sv_warmupReadyPercentage 1.0
set timelimit 0
set fraglimit 0
set g_inactivity 0
set g_password ""
// BobbyBones accuracy targets (aim self-tunes toward these; change live in the console)
set bobby_acc_lg 0.50
set bobby_acc_rg 0.60
set bobby_acc_rl 0.60
map bloodrun duel
