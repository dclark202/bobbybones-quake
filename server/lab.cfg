// BobbyBones lab: public duel-vs-bot server (the lab plugin keeps it on Blood Run, permanent warmup)
set sv_hostname "BobbyBones' Wild Ride | 1v1 vs learning bot"
set sv_tags "bot,duel,practice,bobbybones"
set sv_maxclients 8
set sv_serverType 2
set sv_master 1
set sv_mapPoolFile "mappool_lab.txt"
set g_allowVote 1
set g_doWarmup 1
set sv_warmupReadyPercentage 1.0
set timelimit 0
set fraglimit 0
set g_inactivity 0
set g_password ""
// BobbyBones default accuracy targets until he has measured his opponent (then: opponent + 5%, capped)
set bobby_acc_lg 0.40
set bobby_acc_rg 0.65
set bobby_acc_rl 0.70
