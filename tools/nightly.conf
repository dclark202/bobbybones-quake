# Nightly training template. tools/nightly.sh reads this at 22:00 (start) and 08:00 (stop + archive).
# Edit freely between nights; each run keeps a copy of the config it ran with in data/runs/<date>/.

FIRST_NIGHT=2026-10-02          # nights to run (start dates, inclusive)
LAST_NIGHT=2026-10-06
END_HOUR=8                      # trainers go idle at this local hour the next morning

TRAINERS=300                    # total training servers (each ~2.5-5% of a core, ~70 MB)
CONTROLS=12                     # the last CONTROLS are plain Nightmare in Bobby's seat (the bar to beat)
POP=48                          # coach candidates per generation; Bobby trainers / POP = replicas per candidate
MAPS=bloodrun,aerowalk,campgrounds   # every candidate plays every map; controls alternate maps
BATCH=60                        # boot / restart this many servers at a time ...
GAP=120                         # ... this many seconds apart

VARIANT=aimonly                 # Nightmare movement + decisions, our layers on top
# what the coach searches (all = everything trainable). Groups not listed stay at the baseline values.
COACH_GROUPS=character,items,aim,weapons,prefire,timing,score,position

# Fitness is match win rate (draw = half); frag diff only breaks ties.
# Promotion (morning report): only what beats the control group's win rate, with >= 10 matches.
